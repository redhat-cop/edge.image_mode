---
name: "RHTF"  # Red Hat's Testing Farm

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]
  workflow_dispatch:
  # schedule:
  #   - cron: '0 0 * * *'

jobs:
  rhtf-tests:
    runs-on: ubuntu-latest
    steps:
      # see https://github.com/marketplace/actions/schedule-tests-on-testing-farm
      - name: Schedule test on Testing Farm
        uses: sclorg/testing-farm-as-github-action@v3
        with:
          # testing farm
          api_key: ${{ secrets.RHTF_API_KEY }}
          tf_scope: private
          # TMT metadata
          tmt_plan_regex: "smoke"
          tmt_path: "tests"
          # Test environment
          compose: RHEL-9.5.0-Nightly
          # Test artifacts
          copr: epel-9-x86_64
          # Miscellaneous
          pull_request_status_name: "Smoke test"
